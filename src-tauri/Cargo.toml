[package]
name = "linkassist"
version = "0.1.0"
description = "LinkAssist - BLE/UART/TCP Debug Tool"
authors = ["LinkAssist contributors"]
license = "MIT"
repository = "https://github.com/mingzhuuu/LinkAssist"
edition = "2021"
rust-version = "1.94"

[lib]
name = "linkassist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
log = { version = "0.4", features = ["release_max_level_warn"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Fork carries GAP Appearance support; pin the exact commit for reproducible builds.
btleplug = { version = "=0.12.0", git = "https://github.com/mingzhuliv/btleplug.git", rev = "65c0d76b6f4e5e51d9012723d5ff01fd412e7186" }
futures = "0.3"
tokio-serial = "5.4"
serialport = "4"
socket2 = "0.6"
mlua = { version = "0.10", features = ["lua54", "serialize", "vendored", "send"] }
tauri-plugin-dialog = "2.7.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# Share the HTTP client and SHA-2 implementation already used by iroh.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
base64 = "0.22"
flate2 = "1"
hex = "0.4"
sha2 = "0.11"

# Compile verbose transport diagnostics out of release binaries. Development
# builds retain detailed logging; release keeps warnings/errors. Match log's
# filter because tracing's log compatibility layer has its own static filter.
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Enumeration", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Security_Cryptography", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
# Measured smaller than "s" on Windows; recheck size/performance on toolchain updates.
opt-level = "z"
panic = "abort"
strip = "symbols"

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

# GTK 3 still needs the 0.18 API. Reviewed security/maintenance backports;
# provenance, exact changes and removal criteria: ../vendor/README.md.
[patch.crates-io]
glib = { path = "../vendor/glib" }
glib-macros = { path = "../vendor/glib-macros" }
gtk3-macros = { path = "../vendor/gtk3-macros" }
