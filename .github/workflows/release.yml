name: Windows preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  package:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches all package versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"'
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $tauri -ne $version -or $cargo.Matches[0].Groups[1].Value -ne $version) {
            throw "Tag and package versions differ"
          }
      - run: rustup toolchain install 1.94.1 --profile minimal
      - run: npm ci
      - run: npm run licenses:generate
      - run: npm run tauri build -- --bundles nsis
      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,CHANGELOG.md release-assets/
          Copy-Item -Recurse third-party-licenses release-assets/
          Compress-Archive -Path release-assets/third-party-licenses -DestinationPath release-assets/third-party-licenses.zip
          Get-ChildItem release-assets -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release-assets/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-preview
          path: release-assets/*
          retention-days: 14
  draft:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-preview
          path: release-assets
      - name: Create a draft for installation review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.exe release-assets/*.md release-assets/LICENSE release-assets/SHA256SUMS.txt release-assets/*.zip \
            --verify-tag --draft --prerelease --generate-notes \
            --notes "Windows preview. Installers are currently unsigned. Complete installation and hardware checks before publishing this draft."
